name: iOS CI

on:
  push:
    branches: [claude/tehran-metro-ios-6ij4u7, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, framework-free validation of the domain + data Swift packages.
  package-tests:
    name: Swift Package Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Verify bundled data matches source of truth
        run: |
          diff -q data/stations.json \
            Packages/MetroData/Sources/MetroData/Resources/stations.json

      - name: Test MetroDomain
        run: swift test --package-path Packages/MetroDomain

      - name: Test MetroData
        run: swift test --package-path Packages/MetroData

  # Build the SwiftUI iOS app for the simulator (no signing required).
  ios-build:
    name: Build iOS App
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (iOS Simulator)
        run: |
          xcodebuild \
            -project TehranMetro.xcodeproj \
            -scheme TehranMetro \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
